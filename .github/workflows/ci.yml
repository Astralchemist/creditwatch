name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and compile desktop app
        shell: bash
        run: ./gradlew test :app-desktop:compileKotlin --no-daemon --console=plain
      - name: Verify Windows Credential Manager
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          CREDITWATCH_WINDOWS_CREDENTIAL_SMOKE: '1'
        run: ./gradlew :app-desktop:test --tests '*WindowsCredentialIntegrationTest' --no-daemon --console=plain
      - name: Install Linux Secret Service test tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-user-session gnome-keyring libsecret-tools
      - name: Verify Linux Secret Service
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/linux-secret-service-smoke.sh
